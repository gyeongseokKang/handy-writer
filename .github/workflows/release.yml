name: Release

# v0.2.0 처럼 v로 시작하는 태그를 올리면 설치 파일을 만들어 GitHub Release에 올린다.
# 앱은 이 Release의 latest*.yml 을 보고 자동 업데이트한다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # 지금은 맥에서만 쓰므로 맥용만 만든다. 다시 필요하면 windows-latest, ubuntu-latest를 더한다.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Build and publish
        run: pnpm exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
