name: Release

# 설치 파일을 만들어 GitHub Release에 올린다. 앱은 이 Release의 latest*.yml 을 보고 자동 업데이트한다.
# 이렇게 실행된다:
# - package.json의 version을 올려 main에 푸시하면, 그 버전의 태그(v0.2.0)가 아직 없을 때 태그를 만들고 릴리스한다.
# - v로 시작하는 태그를 직접 올려도 된다.
# - Actions에서 수동 실행하면 package.json 버전으로 같은 일을 한다 (실패한 릴리스를 다시 돌릴 때).
on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 같은 버전을 두 번 동시에 만들지 않는다.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 어느 태그를 릴리스할지 정한다. main 푸시인데 이미 있는 버전이면 릴리스하지 않는다.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # GITHUB_TOKEN으로 올린 태그는 이 워크플로를 다시 실행하지 않는다.
      - id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "$TAG 은 이미 릴리스한 버전이라 건너뛰어요. 버전을 올리면 릴리스돼요."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$(git rev-list -n1 "$TAG")" = "$(git rev-parse HEAD)" ] || { echo "::error::$TAG 태그가 이미 다른 커밋에 있어요. package.json 버전을 올려 주세요"; exit 1; }
            echo "$TAG 태그가 이미 이 커밋에 있어요. 다시 릴리스해요."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 지금은 맥에서만 쓰므로 맥용만 만든다. 다시 필요하면 windows-latest, ubuntu-latest를 더한다.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          # 지난 태그부터의 커밋으로 릴리스 노트를 만든다.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # electron-builder는 파일을 동시에 올리면서 릴리스가 없으면 저마다 새로 만들어 릴리스가 갈라진다.
      # 그래서 노트를 담은 초안 릴리스를 먼저 만들고, electron-builder는 그 초안에 올리기만 하게 한다.
      - name: Create draft release with notes
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "이미 $TAG 릴리스가 있어요. 그 릴리스에 올려요."
            exit 0
          fi
          node scripts/release-notes.mjs "$TAG" > release-notes.md
          cat release-notes.md
          gh release create "$TAG" --verify-tag --draft --title "${TAG#v}" --notes-file release-notes.md

      - name: Build and upload
        run: pnpm exec electron-builder --publish always

      # 파일이 다 올라간 뒤에만 공개한다. 빠진 파일이 있으면 초안으로 남겨 앱이 받지 않게 한다.
      - name: Check files and publish
        run: |
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "$assets"
          for pattern in '\.dmg$' '\.zip$' '\.zip\.blockmap$' '^latest-mac\.yml$'; do
            echo "$assets" | grep -Eq "$pattern" || { echo "::error::$pattern 파일이 릴리스에 없어요"; exit 1; }
          done
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q "[.[] | select(.tag_name == \"$TAG\")] | length")
          [ "$count" = "1" ] || { echo "::error::$TAG 릴리스가 $count개예요"; exit 1; }
          gh release edit "$TAG" --draft=false --latest
